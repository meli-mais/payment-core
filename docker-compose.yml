services:
  wiremock:
    image: wiremock/wiremock:3.9.1
    ports:
      - "8081:8080"
    volumes:
      - ./wiremock/mappings:/home/wiremock/mappings
    command: ["--verbose"]

  payment-service:
    build: .
    ports:
      - "8080:8080"
    environment:
      COMPROVANTES_BASE_URL: http://wiremock:8080
    depends_on:
      - wiremock
